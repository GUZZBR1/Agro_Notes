[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-notes"
version = "0.1.0"
description = "Offline local test harness for livestock event workflows"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "openpyxl>=3.1,<4",
  "openai>=2.0,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "tzdata>=2025.2",
]

[project.scripts]
agro-notes-metrics = "agro_notes.metrics:main"
agro-notes-evaluate-groq = "agro_notes.evaluate_models:main"
agro-notes-evaluate-stt = "agro_notes.evaluate_transcription_models:main"
agro-notes-field-eval = "agro_notes.field_eval:main"
agro-notes-local = "agro_notes.local_cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agro-notes/eval" = ["eval/field_eval_v1.jsonl", "eval/field_golden_core.jsonl"]
"share/agro-notes/eval/fixtures" = ["eval/fixtures/field_eval_predictions.example.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
